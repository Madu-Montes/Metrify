<div class="patients-page">
  <div class="page-header">
    <div>
      <h2>Manage your patients</h2>
      <p> Track patient information and health progress </p>
    </div>
    <button class="btn btn-primary add-button" (click)="addPatient()"> + Add Patient </button>
  </div>

  <div class="filters">
    <div class="search">
      <mat-icon>search</mat-icon>
      <input type="text" placeholder="Search patient...">
    </div>

    <button class="btn btn-filter">Status</button>
    <button class="btn btn-filter">Goal</button>
    <button class="btn btn-filter">Last appointment</button>
  </div>

  <app-patients-table [patients]="patients">

  </app-patients-table>

</div>
